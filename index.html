<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — Bot de Followup de Importações | SeletoComex</title>
<style>
  :root {
    --wa-green: #128C7E;
    --wa-green-dark: #075E54;
    --wa-bubble-in: #FFFFFF;
    --wa-bubble-out: #DCF8C6;
    --bg: #ECE5DD;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .app {
    width: 420px;
    max-width: 100%;
    background: var(--bg);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    height: 640px;
  }
  .header {
    background: var(--wa-green-dark);
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--wa-green);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
  }
  .header .title { font-weight: 600; font-size: 15px; }
  .header .subtitle { font-size: 12px; opacity: 0.85; }
  .phone-select {
    padding: 8px 12px;
    background: #f7f7f7;
    border-bottom: 1px solid #ddd;
    font-size: 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .phone-select select {
    font-size: 12px;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  .messages {
    flex: 1;
    padding: 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 82%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    box-shadow: 0 1px 1px rgba(0,0,0,0.08);
  }
  .bubble.in { align-self: flex-start; background: var(--wa-bubble-in); border-top-left-radius: 0; }
  .bubble.out { align-self: flex-end; background: var(--wa-bubble-out); border-top-right-radius: 0; }
  .bubble b { font-weight: 700; }
  .composer {
    display: flex;
    padding: 10px;
    gap: 8px;
    background: #f0f0f0;
  }
  .composer input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 20px;
    border: 1px solid #ccc;
    font-size: 14px;
  }
  .composer button {
    background: var(--wa-green);
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px; height: 40px;
    cursor: pointer;
    font-size: 16px;
  }
  .composer button:hover { background: var(--wa-green-dark); }
  .hint {
    font-size: 11px;
    color: #666;
    padding: 4px 14px 10px;
    background: #f0f2f5;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="avatar">SC</div>
      <div>
        <div class="title">SeletoComex — Followup</div>
        <div class="subtitle">assistente de acompanhamento de cargas</div>
      </div>
    </div>
    <div class="phone-select">
      Simular cliente:
      <select id="telefone">
        <option value="5511987654321">Nortesul (11 98765-4321)</option>
        <option value="5521998877665">Vale Verde (21 99887-7665)</option>
        <option value="5571991234567">Bahia Têxtil (71 99123-4567)</option>
        <option value="5599900000000">Número desconhecido</option>
      </select>
    </div>
    <div class="messages" id="messages"></div>
    <div class="hint">
      Dica: pergunte "qual o status do container MSCU1234567" ou "como está o processo 2026-0451".
    </div>
    <div class="composer">
      <input id="input" type="text" placeholder="Digite uma mensagem..." autocomplete="off" />
      <button id="send">➤</button>
    </div>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const telefoneEl = document.getElementById('telefone');

function addBubble(text, who) {
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.innerHTML = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*(.+?)\*/g, '<b>$1</b>')
    .replace(/\n/g, '<br>');
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

addBubble('Olá! 👋 Sou o assistente de acompanhamento de cargas da SeletoComex. Me envie o número do processo, do container ou do BL, ou simplesmente pergunte o status da sua importação.', 'in');

async function enviar() {
  const texto = inputEl.value.trim();
  if (!texto) return;
  addBubble(texto, 'out');
  inputEl.value = '';

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({telefone: telefoneEl.value, mensagem: texto})
    });
    const data = await resp.json();
    addBubble(data.resposta, 'in');
  } catch (e) {
    addBubble('⚠️ Erro ao falar com o servidor do bot. Verifique se o app.py está rodando.', 'in');
  }
}

sendBtn.addEventListener('click', enviar);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviar(); });
</script>
</body>
</html>
